/* ---------- اللعب ---------- */
function olStartPlay() {
  ol.phase = 'play';
  if (BOARD.includes(ol.room.game)) {
    ol.bgame = ol.room.game; ol.awarded = false; ol.sel = -1; ol.pick = -1; ol.cply = undefined;
    return obSync();
  }
  ol.i = 0;
  ol.score = 0;
  ol.ok = 0;
  ol.qs = [];
  ol.streak = 0;
  ol.hang = ol.room.game === 'hang';
  (ol.room.qs || []).forEach(k => {
    const parts = String(k).split('-');
    if (parts[0] === 'h') {
      const h = HANG[Number(parts[1])];
      if (h) ol.qs.push(h);
      return;
    }
    const a = Number(parts[0]), b = Number(parts[1]);
    const q = DATA[a] && DATA[a].q[b];
    if (q) ol.qs.push({ ...q, o: shuffle([q.c, ...q.w]), time: 20 });
  });
  if (!ol.qs.length) return onlineMenu('صارت مشكلة في الأسئلة');
  if (ol.room.live && !ol.hang && ol.room.t0) {
    ol.live = true;
    const go = () => olLive();
    try { getDb().ref('.info/serverTimeOffset').once('value').then(v => { ol.off = Number(v.val()) || 0; go(); }).catch(go); }
    catch (e) { go(); }
    return;
  }
  olCountdown(() => { ol.hang ? olHang() : olQuestion(); });
}

function olBoard() {
  const ps = olPlayers().sort((a, b) => (b.score || 0) - (a.score || 0));
  const total = (ol.room.qs || []).length;
  return ps.map((p, i) => `
    <div class="prow ${p.id === PID ? 'me' : ''}">
      <span class="rk">${i < 3 && (p.score || 0) > 0 ? ['🥇', '🥈', '🥉'][i] : i + 1}</span>
      <span class="nm">${esc(p.name)}${p.id === PID ? ' (انت)' : ''} <small>${p.fin ? 'كمّل' : (p.done || 0) + '/' + total}</small></span>
      <b>${Number(p.score) || 0}</b>
    </div>`).join('');
}

function olQuestion() {
  stopAll();
  const q = ol.qs[ol.i];
  ol.locked = false;
  st = { score: ol.score, mode: 'online', streak: ol.streak || 0 };
  app.innerHTML = `
    ${topBar(`السؤال <b>${ol.i + 1}</b> من ${ol.qs.length}`, q.time)}
    <div class="arch">${q.t}</div>
    <div class="opts">
      ${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span dir="auto">${o}</span></button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div id="next"></div>
    <div class="lb-title">الترتيب مباشرة</div>
    <div id="lb">${olBoard()}</div>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => olAnswer(Number(b.dataset.k))));
  runTimer(q.time, () => olAnswer(-1));
}

function olAnswer(k) {
  if (ol.locked) return;
  ol.locked = true;
  const left = parseInt(document.getElementById('sec').textContent, 10) || 0;
  clearInterval(timer);
  const q = ol.qs[ol.i];
  const right = q.o.indexOf(q.c);
  const fb = document.getElementById('fb');

  app.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if (idx === right) b.classList.add('ok');
    else if (idx === k) b.classList.add('bad');
    else b.classList.add('dim');
  });

  if (k === right) {
    ol.streak = (ol.streak || 0) + 1;
    const pts = q.d * 10 + Math.floor(left / 4) + (ol.streak >= 3 ? 5 : 0);   // الصعوبة + السرعة + سلسلة
    ol.score += pts;
    ol.ok++;
    fb.className = 'feedback ok';
    fb.textContent = `${pick(OKM)} +${pts} نقطة` + (ol.streak >= 3 ? ` 🔥 ${ol.streak} على التوالي` : '');
    cue(true);
  } else {
    ol.streak = 0;
    fb.className = 'feedback bad';
    fb.textContent = (k === -1 ? 'الوقت خلص! ' : pick(KOM) + ' ') + `الجواب: ${q.c}`;
    cue(false);
  }

  const last = ol.i === ol.qs.length - 1;
  ol.ref.child('players/' + PID).update({ score: ol.score, done: ol.i + 1, fin: last }).catch(() => {});

  document.getElementById('next').innerHTML =
    `<button class="primary" id="nextBtn">${last ? 'شوف الترتيب' : 'السؤال التالي'}</button>`;
  const nb = document.getElementById('nextBtn');
  nb.addEventListener('click', () => { last ? olEnd() : (ol.i++, olQuestion()); });
  nb.focus();
}

/* ---------- النهاية ---------- */
function olEnd() {
  stopAll();
  ol.phase = 'end';
  const ps = olPlayers().sort((a, b) => (b.score || 0) - (a.score || 0));
  const first = ps[0];
  const allDone = ps.every(p => p.fin);
  const winner = allDone && first
    ? (first.id === PID ? 'مبروك، انت الأول! 🏆' : `الأول: ${esc(first.name)} 🏆`)
    : 'نستناو الباقي يكمّلوا...';
  if (!ol.awarded) { ol.awarded = true; award(ol.score); }
  if (allDone && !ol.celebrated) {
    ol.celebrated = true;
    if (first && first.id === PID) { confetti(130); sfx('win'); } else sfx('go');
  }
  app.innerHTML = `
    <div class="res-head">
      <div class="res-score">${ol.score}<span> نقطة</span></div>
      <div class="res-msg">${winner}</div>
      <div class="res-stats">${ol.ok} إجابات صحيحة من ${ol.qs.length}</div>
    </div>
    <div class="lb-title">الترتيب</div>
    <div>${olBoard()}</div>
    <div class="actions">

    </div>`;

/* ============ الدردشة الصوتية (WebRTC) ============
   الصوت يمشي مباشرة بين التيليفونات، وFirebase يستعمل برك باش يعرّف اللاعبين ببعضهم. */
let ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
] };
let TURN_ON = false;
// خدمة TURN اختيارية (تتحط في config.js) باش يخدم الصوت بين شبكتين مختلفتين
async function loadIce() {
  const c = window.CHNWA || {};
  if (TURN_ON) return;
  const extra = Array.isArray(c.iceServers) ? c.iceServers.slice() : [];
  if (c.turnApi) {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(c.turnApi, { signal: ctl.signal });
      clearTimeout(to);
      const arr = await r.json();
      if (Array.isArray(arr)) arr.forEach(x => extra.push(x));
    } catch (e) {}
  }
  if (extra.length) { ICE = { iceServers: ICE.iceServers.concat(extra) }; TURN_ON = true; }
}

function vSend(to, type, data) {
  try { ol.ref.child('sig/' + to).push({ from: PID, type, data: JSON.stringify(data) }); } catch (e) {}
}

function vPeer(id) {
  if (ol.peers[id]) return ol.peers[id];
  const pc = new RTCPeerConnection(ICE);
  const p = { pc, queue: [], audio: null, since: Date.now() };
  ol.peers[id] = p;
  if (ol.local) ol.local.getTracks().forEach(t => pc.addTrack(t, ol.local));
  else pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = e => {
    const stream = e.streams[0] || new MediaStream([e.track]);
    if (!p.audio) {
      p.audio = document.createElement('audio');
      p.audio.autoplay = true;
      p.audio.playsInline = true;
      document.body.appendChild(p.audio);
    }
    p.audio.srcObject = stream;
    p.audio.play().catch(() => {});
  };
  pc.onicecandidate = e => { if (e.candidate) vSend(id, 'ice', e.candidate.toJSON()); };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (ol && ol.peers[id] === p) {
      if (st === 'connected') ol.vfail = '';
      else if (st === 'failed') {
        if (!p.retried && PID < id) { p.retried = true; vOffer(id, true); }
        else ol.vfail = TURN_ON ? 'الصوت ما قدرش يوصل، اخرج وعاود فعّلو' : 'الصوت ما وصلش بين الشبكتين (يحتاج خدمة TURN)';
      }
    }
    vBar();
  };
  return p;
}

function vClose(id) {
  const p = ol && ol.peers[id];
  if (!p) return;
  try { p.pc.close(); } catch (e) {}
  if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
  delete ol.peers[id];
}

async function vFlush(p) {
  while (p.queue.length) {
    try { await p.pc.addIceCandidate(p.queue.shift()); } catch (e) {}
  }
}

async function vOffer(id, restart) {
  const p = vPeer(id);
  try {
    const offer = await p.pc.createOffer(restart ? { iceRestart: true } : undefined);
    await p.pc.setLocalDescription(offer);
    vSend(id, 'offer', p.pc.localDescription.toJSON());
  } catch (e) {}
}

async function onSignal(m) {
  if (!ol || !ol.voice || !m || !m.from) return;
  let d;
  try { d = JSON.parse(m.data); } catch (e) { return; }
  try {
    if (m.type === 'offer') {
      if (ol.peers[m.from]) vClose(m.from);
      const p = vPeer(m.from);
      await p.pc.setRemoteDescription(d);
      await vFlush(p);
      const ans = await p.pc.createAnswer();
      await p.pc.setLocalDescription(ans);
      vSend(m.from, 'answer', p.pc.localDescription.toJSON());
    } else if (m.type === 'answer') {
      const p = ol.peers[m.from];
      if (!p) return;
      await p.pc.setRemoteDescription(d);
      await vFlush(p);
    } else if (m.type === 'ice') {
      const p = ol.peers[m.from];
      if (!p) return;
      if (p.pc.remoteDescription) await p.pc.addIceCandidate(d);
      else p.queue.push(d);
    }
  } catch (e) {}
  vBar();
}

// يتنادى كل ما تتبدّل الغرفة: اللي ID متاعو أصغر هو اللي يبدا الاتصال
function voiceSync() {
  if (!ol || !ol.voice) return;
  const v = (ol.room && ol.room.voice) || {};
  Object.keys(ol.peers).forEach(id => {
    if (!v[id] && Date.now() - ol.peers[id].since > 3000) vClose(id);
  });
  Object.keys(v).forEach(id => {
    if (id !== PID && !ol.peers[id] && PID < id) vOffer(id);
  });
  vBar();
}

async function voiceJoin() {
  if (!ol || ol.voice) return;
  const mine = ol;
  mine.voice = true;
  mine.muted = false;
  mine.vmsg = '';
  mine.vfail = '';
  vBar();
  await loadIce();
  let s = null;
  try {
    s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    const n = e && e.name;
    mine.vmsg = (!window.isSecureContext || !navigator.mediaDevices) ? 'الميكرو يحتاج رابط https (تسمع برك)'
              : n === 'NotAllowedError' ? 'الإذن مرفوض (تسمع برك)'
              : n === 'NotFoundError' ? 'ما لقيناش ميكرو (تسمع برك)'
              : 'الميكرو موش متاح (تسمع برك)';
  }
  if (ol !== mine || !mine.voice) { if (s) s.getTracks().forEach(t => t.stop()); return; }
  mine.local = s;
  try {
    const r = mine.ref.child('voice/' + PID);
    r.onDisconnect().remove();
    await r.set(true);
  } catch (e) {}
  voiceSync();
}

function voiceStop(removeFlag) {
  if (!ol) return;
  Object.keys(ol.peers).forEach(vClose);
  if (ol.local) ol.local.getTracks().forEach(t => t.stop());
  ol.local = null;
  if (ol.voice && removeFlag) {
    try { ol.ref.child('voice/' + PID).remove(); } catch (e) {}
  }
  ol.voice = false;
}

function voiceMute() {
  if (!ol || !ol.local) return;
  ol.muted = !ol.muted;
  ol.local.getAudioTracks().forEach(t => { t.enabled = !ol.muted; });
  vBar();
}

function vBar() {
  const el = document.getElementById('vbar');
  if (!el || !ol) return;
  if (!ol.voice) {
    el.innerHTML = `<button class="vbtn" id="vjoin">🎤 فعّل الصوت</button>`;
    document.getElementById('vjoin').addEventListener('click', voiceJoin);
    return;
  }
  const others = Object.keys((ol.room && ol.room.voice) || {}).filter(id => id !== PID).length;
  const live = Object.values(ol.peers).filter(p => p.pc.connectionState === 'connected').length;
  el.innerHTML = `
    ${ol.local ? `<button class="vbtn ${ol.muted ? 'muted' : ''}" id="vmute">${ol.muted ? '🔇 مكتوم' : '🎤 تحكي'}</button>` : ''}
    <span class="vinfo">${ol.vmsg ? esc(ol.vmsg) : ol.vfail ? esc(ol.vfail) : '🔊 ' + live + '/' + others}</span>
    <button class="vbtn soft" id="vleave">اخرج</button>`;
  const mu = document.getElementById('vmute');
  if (mu) mu.addEventListener('click', voiceMute);
  document.getElementById('vleave').addEventListener('click', () => { voiceStop(true); vBar(); });
}

initUi();
home();
</script>
