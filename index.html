      if (age > 30000) show(); else setTimeout(show, 30000 - age);
    }
  };
  document.getElementById('bd').addEventListener('click', e => {
    const em = e.target.closest('[data-emo]');
    if (em) { if (meIdx >= 0) ol.ref.child('bg/emo').set({ c: mp, e: em.dataset.emo, t: Date.now() }).catch(() => {}); return; }
    if (anim || !mine) return;
    if (e.target.closest('[data-roll]') && !S.dice) {
      const v = 1 + Math.floor(Math.random() * 6), N = ldRoll(S, v);
      return ldSave(b, N.sx >= 3 ? ldPass(N) : N);
    }
    const pc = e.target.closest('[data-pc]');
    if (!pc || !S.dice) return;
    const [p, i] = pc.dataset.pc.split('_').map(Number);
    if (p === mp && lg.includes(i)) doMove(i);
  });
  if (emo && Math.abs(Date.now() - emo.t) < 4000) setTimeout(() => { const c = ol && ol.room && ol.room.bg; if (c && c.emo && c.emo.t === emo.t && ol.ldTok === tok) { const bd = document.getElementById('bd'); if (bd) bd.innerHTML = ldScene(S, { names, lv: null, canRoll: !anim && mine && !S.dice, rolling: false, mineP: mp, mv: anim ? [] : mv, emo: null }); } }, 3200);
  if (anim) {
    let k = 1;
    const tick = () => {
      if (!live()) return;
      if (k < steps.length) { sfx('tick'); document.getElementById('bd').innerHTML = scene(steps[k++], [], false); return setTimeout(tick, 140); }
      anim = false;
      document.getElementById('bd').innerHTML = scene(S, mv, mine && !S.dice);
      later();
    };
    setTimeout(tick, 140);
  } else later();
}

/* ============ لودو: إحصائيات، تحدّيات، تخصيص، لعب سريع ============ */
const LD_SKIN_B = [['blue', 'أزرق', 0], ['wood', 'خشب', 150], ['night', 'ليل', 400]];
const LD_SKIN_D = [['white', 'أبيض', 0], ['gold', 'ذهبي', 250], ['black', 'أسود', 500]];
const LD_SKIN_P = [['pin', 'دبوس', 0], ['ball', 'كرة', 100], ['gem', 'ماسة', 350]];
function ldSkin() { try { return Object.assign({ b: 'blue', d: 'white', p: 'pin' }, JSON.parse(store('ldskin') || '{}')); } catch (e) { return { b: 'blue', d: 'white', p: 'pin' }; } }
function ldPts() { try { return stats().pts || 0; } catch (e) { return 0; } }
function ldStat() { try { return Object.assign({ g: 0, w: 0, c: 0, s: 0 }, JSON.parse(store('ldstat') || '{}')); } catch (e) { return { g: 0, w: 0, c: 0, s: 0 }; } }
function ldRecord(win, caps, sixes) {
  const s = ldStat(); s.g++; if (win) s.w++; s.c += caps || 0; s.s += sixes || 0;
  try { store('ldstat', JSON.stringify(s)); } catch (e) {}
  if (win) ldQAdd('wins', 1);
}
const LD_CH = [
  { id: 'c1', t: 'اضرب 3 حجارة', k: 'caps', n: 3, pts: 20 },
  { id: 'c2', t: 'جيب 6 أربع مرات', k: 'sixes', n: 4, pts: 15 },
  { id: 'c3', t: 'دخّل 3 حجارة للمركز', k: 'fins', n: 3, pts: 20 },

];
function ldQ() {
  let q = null;

}
function ldQAdd(k, n) {

}
function ldChHtml() {
  const q = ldQ();

    const v = Math.min(q[c.k] || 0, c.n), done = v >= c.n, got = q.got[c.id];
    return `<div class="prow"><span class="nm">${c.t} <small>(${v}/${c.n})</small></span>${got ? '<small>✅ تاخذت</small>' : done ? `<button class="ghost" data-ch="${c.id}" style="width:auto;margin:0;padding:0 12px;min-height:32px">🎁 +${c.pts}</button>` : `<small>+${c.pts}</small>`}</div>`;

}

    return `<button class="ghost${sk[key] === x[0] ? ' on' : ''}" data-sk="${key}:${x[0]}:${x[2]}" style="width:auto;margin:0;padding:0 12px;min-height:34px;${sk[key] === x[0] ? 'outline:3px solid var(--sun);' : ''}${lock ? 'opacity:.55' : ''}">${lock ? '🔒 ' + x[2] : ''} ${x[1]}</button>`;

/* ---------- لعب سريع (ماتش ميكينغ) ---------- */
function ldQuick() {
  const db = getDb(), name = olName();
  if (!name) return olErr('اكتب اسمك الأول');
  if (!db) return olErr('السيرفر موش حاضر');
  const qref = db.ref('qm/ludo'), me = qref.child(PID), mref = db.ref('qm/match/' + PID);
  let done = false, latest = [], since = 0, qcb = null, mcb = null, iv = null, to = null;
  const stop = () => {
    clearInterval(iv); clearTimeout(to);
    try { qref.off('value', qcb); mref.off('value', mcb); } catch (e) {}
    me.remove().catch(() => {}); mref.remove().catch(() => {});
  };
  app.innerHTML = `
    <h1 class="home-title">🎯 لعب سريع</h1>
    <p class="home-sub" style="text-align:center">نقصدو لاعبين متاحين توّا للودو (2 إلى 4)...</p>
    <div class="namebox" style="text-align:center"><b id="qmn">انت لوحدك توّا</b><br><small>ما تسكّرش الصفحة</small></div>
    <button class="ghost" id="qmc">إلغاء</button>`;
  document.getElementById('qmc').addEventListener('click', () => { done = true; stop(); onlineMenu(); });
  const host = async list => {
    done = true; stop();
    try {
      const ids = list.map(x => x.id);
      const players = {};
      list.forEach(x => { players[x.id] = { name: String(x.name || 'لاعب').slice(0, 14), score: 0, done: 0, fin: false }; });
      for (let tries = 0; tries < 8; tries++) {
        const code = String(rnd(1000, 9999));
        const room = { host: PID, status: 'playing', game: 'ludo', live: false, cat: 'all', qs: [], created: firebase.database.ServerValue.TIMESTAMP, players, bg: obInit('ludo', PID, ids.filter(i => i !== PID)) };
        const res = await db.ref('rooms/' + code).transaction(cur => (cur === null ? room : undefined));
        if (res.committed) {
          await Promise.all(ids.filter(i => i !== PID).map(i => db.ref('qm/match/' + i).set({ code }).catch(() => {})));
          await Promise.all(ids.map(i => qref.child(i).remove().catch(() => {})));
          return olEnter(code, true);
        }
      }
      onlineMenu('ما نجمناش نعملو غرفة، عاود');
    } catch (e) { onlineMenu('صارت مشكلة في الاتصال'); }
  };
  const tick = () => {
    if (done) return;
    const n = latest.length;
    const el = document.getElementById('qmn');
    if (el) el.textContent = n >= 2 ? `لقينا ${n} لاعبين...` : 'انت لوحدك توّا';
    if (n >= 2 && !since) since = Date.now();
    if (n < 2) since = 0;
    if (n >= 2 && latest[0].id === PID && (n >= 4 || Date.now() - since >= 6000)) host(latest.slice(0, 4));
  };
  mref.remove().catch(() => {}).then(() => {
    if (done) return;
    mcb = mref.on('value', s => { const v = s.val(); if (v && v.code && !done) { done = true; stop(); olEnter(v.code, false); } });
    me.set({ name, t: firebase.database.ServerValue.TIMESTAMP }).catch(() => {});
    try { me.onDisconnect().remove(); } catch (e) {}
    qcb = qref.on('value', s => {
      const v = s.val() || {};
      latest = Object.keys(v).map(id => ({ id, ...v[id] })).sort((a, b) => (Number(a.t) || 0) - (Number(b.t) || 0) || (a.id < b.id ? -1 : 1));
      tick();
    });

    to = setTimeout(() => { if (!done) { done = true; stop(); onlineMenu('ما لقيناش لاعبين توّا، عاود بعد شوية ولا العب بكود'); } }, 90000);
  });
}

/* ============ 7 et demi (الكارطة التونسية) ============ */
const SDV = id => { const v = CV(id); return v >= 8 ? 0.5 : v; };
const sdSum = a => a.reduce((t, x) => t + SDV(x), 0);
const sdFmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
function sdBust(g, c) {
  const need = 7.5 - c, n = g.deck.length;
  return n ? g.deck.filter(x => SDV(x) > need).length / n : 1;
}
function sdWants(g) {
  const pl = sdSum(g.me), c = sdSum(g.cpu);
  if (g.lvl === 1) return c < 5;
  if (c > pl) return false;
  if (c === pl) return g.lvl === 3 ? sdBust(g, c) < 0.2 : false;
  return g.lvl === 3 ? true : sdBust(g, c) < 0.7;
}
function sdDraw(g) {
  const bd = document.getElementById('bd');
  if (!bd || bg !== g) return;
  const hide = g.ph === 'me' && !g.over;
  const row = (arr, h) => arr.map((x, i) => h && i === 0 ? '<div class="kc back sdc"></div>' : ckbCard(x, 'sdc')).join('');
  bd.innerHTML = `<div class="sdrow"><b>الكمبيوتر · ${hide ? '؟' : sdFmt(sdSum(g.cpu))}</b><div class="sdcards">${row(g.cpu, hide)}</div></div>
    <div class="sdrow"><b>انت · ${sdFmt(sdSum(g.me))}</b><div class="sdcards">${row(g.me, false)}</div></div>
    <small>الكارطات لي بقات: ${g.deck.length}</small>`;
  document.getElementById('bmsg').textContent = g.msg;
  const on = g.ph === 'me' && !g.over;
  document.getElementById('sdh').disabled = !on;
  document.getElementById('sds').disabled = !on;
}
function sdFinish(g) {
  g.ph = 'end';
  const m = sdSum(g.me), c = sdSum(g.cpu), base = [25, 30, 40][g.lvl - 1] || 30;
  let res, pts, text;
  if (m > 7.5) { res = 'loss'; pts = 3; text = 'فوّتّ 7.5 💥 خسرت'; }
  else if (c > 7.5) { res = 'win'; pts = base; text = 'الكمبيوتر فوّت 7.5! ربحت 🎉'; }
  else if (m > c) { res = 'win'; pts = base; text = `ربحت ${sdFmt(m)} ضد ${sdFmt(c)} 🎉`; }
  else if (m === c) { res = 'draw'; pts = 10; text = 'تعادل'; }
  else { res = 'loss'; pts = 3; text = `خسرت: ${sdFmt(m)} ضد ${sdFmt(c)}`; }
  if (res === 'win' && m === 7.5) { pts += 20; text += ' · 7.5 بالضبط! ⭐'; }
  g.msg = text;
  sdDraw(g);
  bgEnd(res, pts, text);
}
function sdCpu(g) {
  if (bg !== g || g.over) return;
  if (sdSum(g.cpu) <= 7.5 && sdWants(g)) {
    g.cpu.push(g.deck.pop()); sfx('pop'); g.msg = 'الكمبيوتر يجبد ورقة...'; sdDraw(g);
    return setTimeout(() => sdCpu(g), 800);
  }
  sdFinish(g);
}
function sdStand(g) {
  if (g.ph !== 'me' || g.over) return;
  g.ph = 'cpu'; g.msg = 'دور الكمبيوتر...'; sdDraw(g);
  setTimeout(() => sdCpu(g), 800);
}
function sdStart(lvl) {
  const g = bg = { game: 'sd', lvl, deck: sshuffle(Array.from({ length: 40 }, (_, i) => i), Math.random), me: [], cpu: [], ph: 'me', over: false, busy: false, msg: 'جبد ورقة ولا وقّف.' };
  g.me.push(g.deck.pop()); g.cpu.push(g.deck.pop());
  g.again = () => sdStart(lvl);
  bgPage('7️⃣ ⁦7 et demi⁩', 'قرّب من 7.5 من غير ما تفوّتها. الموجيرا والكوال والراي يسواو نصّ.', `<div class="kw" id="bd"></div><div id="bmsg" class="home-sub"></div><div id="bres"></div>
    <div class="joinrow"><button class="primary" id="sdh">🃏 ورقة</button><button class="ghost" id="sds">✋ نوقف</button></div>
    <div class="joinrow"><button class="ghost" id="bnew">لعبة جديدة</button></div>`);
  document.getElementById('bnew').addEventListener('click', () => sdStart(lvl));

  if (m) return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?autoplay=1&playsinline=1&rel=0';
  if (/^https:\/\/(www\.|m\.|web\.)?facebook\.com\//.test(url)) return 'https://www.facebook.com/plugins/video.php?href=' + encodeURIComponent(url) + '&show_text=false&autoplay=true';

/* ---------- إنشاء غرفة ---------- */
async function olCreate() {
  const name = olName();
  if (!name) return olErr('اكتب اسمك الأول');
  const db = getDb();
  if (!db) return olErr('السيرفر موش حاضر');
  const ct = document.getElementById('ct').value;
  const gm = document.getElementById('gm').value;
  const md = document.getElementById('md').value;
  const nq = Number(document.getElementById('nq').value) || 20;
  let qs;
  if (BOARD.includes(gm) || gm === 'voice' || gm === 'bw' || gm === 'draw' || gm === 'team') {
    qs = [];
  } else if (gm === 'hang') {
    qs = freshPick(HANG.map((h, i) => ({ k: 'h-' + i, t: h.w })), x => qkey(x.t), Math.min(nq, 10)).map(x => x.k);
  } else {
    const pool = [];
    DATA.forEach((c, ci) => {
      if (ct === 'all' || c.id === ct) c.q.forEach((q, qi) => pool.push({ k: ci + '-' + qi, t: q.t }));
    });
    qs = freshPick(pool, x => qkey(x.t), nq).map(x => x.k);
  }
  document.getElementById('mk').disabled = true;
  try {
    for (let tries = 0; tries < 6; tries++) {
      const code = String(rnd(1000, 9999));
      const room = {
        host: PID, status: 'lobby', game: gm, live: gm === 'quiz' && md === 'live', cat: ct, qs,
        created: firebase.database.ServerValue.TIMESTAMP,
        players: { [PID]: { name, score: 0, done: 0, fin: false } }
      };
      if (gm === 'ludo') room.lopt = document.getElementById('lo').value;
      const res = await db.ref('rooms/' + code).transaction(cur => (cur === null ? room : undefined));
      if (res.committed) { olEnter(code, true); if (gm === 'voice') voiceJoin(); return; }
    }
    olErr('ما نجمناش نعملو غرفة، عاود المحاولة');
  } catch (e) {
    olErr('صارت مشكلة في الاتصال بالسيرفر');
  }
  const mk = document.getElementById('mk');
  if (mk) mk.disabled = false;
}

/* ---------- دخول غرفة ---------- */
async function olJoin() {
  const name = olName();
  if (!name) return olErr('اكتب اسمك الأول');
  const code = document.getElementById('cd').value.trim();
  if (!/^\d{4}$/.test(code)) return olErr('الكود يكون 4 أرقام');
  const db = getDb();
  if (!db) return olErr('السيرفر موش حاضر');
  try {
    const snap = await db.ref('rooms/' + code).once('value');
    const room = snap.val();
    if (!room) return olErr('الغرفة هذي ما لقيناهاش');
    const players = room.players || {};
    if (!players[PID]) {
      if (room.status !== 'lobby') return olErr('اللعبة بدات في هذي الغرفة');
      if (Object.keys(players).length >= (room.game === 'ludo' ? 4 : BOARD.includes(room.game) ? 2 : MAX_PLAYERS)) return olErr('الغرفة عامرة');
      await db.ref('rooms/' + code + '/players/' + PID).set({ name, score: 0, done: 0, fin: false });
    }
    olEnter(code, room.host === PID);
  } catch (e) {
    olErr('صارت مشكلة في الاتصال بالسيرفر');
  }
}

function olEnter(code, host) {
  const db = getDb();
  const ref = db.ref('rooms/' + code);
  try { store('lastroom', code); } catch (e) {}
  ol = { code, host, ref, phase: 'lobby', room: null, cb: null,
         voice: false, muted: false, local: null, peers: {}, vmsg: '', sigRef: null, sigCb: null };

  // الصوت: شريط التحكم + استقبال رسائل الاتصال
  const vb = document.createElement('div');
  vb.id = 'vbar';
  document.body.appendChild(vb);
  const vn = document.createElement('div');
  vn.id = 'vn';
  document.body.appendChild(vn);
  app.style.paddingBottom = '150px';
  reactBar();
  ol.sigRef = ref.child('sig/' + PID);
  ol.sigRef.remove().catch(() => {});
  ol.sigCb = ol.sigRef.on('child_added', snap => {
    const m = snap.val();
    snap.ref.remove().catch(() => {});
    onSignal(m);
  });
  vBar();

  ol.cb = ref.on('value', snap => {
    if (!ol) return;
    ol.room = snap.val();
    if (!ol.room) { if (ol.phase === 'lobby') onlineMenu('الغرفة تسكّرت'); return; }
    voiceSync();
    reactCheck(ol.room.react);
    if (ol.phase === 'lobby') {
      if (ol.room.status === 'playing') olStartPlay();
      else olLobby();
    } else if (ol.phase === 'play') {
      if (ol.bwg) return bwSync();
      if (ol.drg) return drSync();
      if (ol.tmg) return tmSync();
      if (ol.bgame) return obSync();
      const lb = document.getElementById('lb');
      if (lb && (!ol.live || ol.revealing)) lb.innerHTML = olBoard();
    } else if (ol.phase === 'end') {
      olEnd();
    }
  }, () => onlineMenu('انقطع الاتصال بالسيرفر'));
}

/* ============ بنت ولد أونلاين: مرحلة بمرحلة ============ */
function bwLetterSel() {
  return `<select class="input" id="bwl" aria-label="الحرف"><option value="r">🎲 حرف عشوائي</option>${BW_L.map(l => `<option value="${l}" ${ol.bwl === l ? 'selected' : ''}>الحرف: ${l}</option>`).join('')}</select>`;
}
function bwStagePts(room, s) {
  const b = room.bw, cat = BW_CATS[s][0], ans = (room.bwa && room.bwa['s' + s]) || {};
  const pl = room.players || {}, out = {}, cnt = {};
  Object.keys(pl).forEach(id => {
    const w = ans[id] || '', n0 = bwNorm(w), L0 = bwNorm(b.L);
    const okw = n0 && (n0[0] === L0 || (BW_BANK[cat][L0] || []).includes(n0));
    const fl = Object.keys(((room.bwv && room.bwv['s' + s]) || {})[id] || {}).filter(v => v !== id && pl[v]).length;
    const rej = fl > 0 && fl * 2 > Object.keys(pl).length - 1;
    const base = okw && !rej ? 10 : 0;
    out[id] = { w, p: base, a: ans[id] !== undefined, fl, rej };
    if (base) { const n = bwNorm(w); cnt[n] = (cnt[n] || 0) + 1; }
  });
  Object.keys(out).forEach(id => { if (out[id].p && cnt[bwNorm(out[id].w)] > 1) out[id].p = 5; });
  return out;
}
function bwTotals(room, upto) {
  const t = {};
  Object.keys(room.players || {}).forEach(id => { t[id] = 0; });
  for (let s = 0; s <= upto; s++) {
    const r = bwStagePts(room, s);
    Object.keys(r).forEach(id => { t[id] += r[id].p; });
  }
  return t;
}
function bwSync() {
  const r = ol.room, b = r && r.bw;
  if (!b) return;
  const key = b.s + b.ph;
  if (ol.bwKey !== key || b.ph !== 'w') { const fresh = ol.bwKey !== key; ol.bwKey = key; bwDraw(fresh); }
  else bwStatus();
  if (ol.host) bwHost();
}
function bwStatus() {
  const el = document.getElementById('bwst');
  if (!el) return;
  const s = ol.room.bw.s, ans = (ol.room.bwa && ol.room.bwa['s' + s]) || {};
  const n = Object.keys(ol.room.players || {}).length;
  el.textContent = Object.keys(ans).length + ' / ' + n + ' جاوبوا';
}
function bwHost() {
  const b = ol.room.bw, key = b.s + b.ph;
  if (b.ph !== 'w') return;
  const ans = (ol.room.bwa && ol.room.bwa['s' + b.s]) || {};
  if (Object.keys(ans).length >= Object.keys(ol.room.players || {}).length && ol.bwAdv !== key) {
    ol.bwAdv = key;
    ol.ref.child('bw').update({ ph: 'r' }).catch(() => {});
  }
}
function bwSubmit() {
  const b = ol.room && ol.room.bw;
  if (!b || b.ph !== 'w') return;
  const key = b.s + b.ph;
  if (ol.bwSent === key) return;
  ol.bwSent = key;

  if (bt) bt.disabled = true;
  ol.ref.child('bwa/s' + b.s + '/' + PID).set(v).catch(() => {});
}
function bwDraw(fresh) {
  const r = ol.room, b = r.bw, pl = r.players || {};
  const nm = id => (pl[id] && pl[id].name) || '؟';
  const catL = BW_CATS[Math.min(b.s, 5)][1];
  if (b.ph === 'w') {
    if (!fresh) return;
    app.innerHTML = `
      ${bwHead(b.s, b.L, '<span class="chip" id="bwt">15</span><span class="chip" id="bwst"></span>', true)}
      <input class="input bwin-input" id="bwi" placeholder="${catL} بحرف ${b.L}" autocomplete="off" style="letter-spacing:0">
      <button class="primary" id="bwok" style="margin-top:10px">ثبّت الجواب ✅</button>`;
    document.getElementById('bwok').addEventListener('click', bwSubmit);
    document.getElementById('bwi').addEventListener('keydown', e => { if (e.key === 'Enter') bwSubmit(); });
    document.getElementById('bwi').focus();
    const key = b.s + b.ph, mine = ol;

 <p class="home-sub" style="text-align:center;margin:8px 0 0">كلمة غالطة؟ دوس 🚩 عليها. كان أغلبية اللاعبين الآخرين فلّغوها تولّي 0.</p>

    document.getElementById('lv').addEventListener('click', () => onlineMenu());

  }
  // نهاية اللعبة
  const medals = ['🥇', '🥈', '🥉'];
  app.innerHTML = `
    <h1 class="home-title">🏆 النتيجة النهائية</h1>
    <div class="bwpodium">${[1, 0, 2].filter(k => ids[k]).map(k => `<div class="p${k + 1}"><div style="font-size:1.8rem">${medals[k]}</div>${esc(nm(ids[k]))}<br>${tot[ids[k]]}</div>`).join('')}</div>
    <div class="plist">${ids.map((id, i) => `<div class="prow ${id === PID ? 'me' : ''}"><span class="nm">${medals[i] || (i + 1) + '.'} ${esc(nm(id))}</span><small>${tot[id]} نقطة</small></div>`).join('')}</div>
    <button class="ghost" id="lv" style="margin-top:12px">اخرج من الغرفة</button>`;
  document.getElementById('lv').addEventListener('click', () => onlineMenu());
  if (!ol.bwAwarded) {
    ol.bwAwarded = true;
    const mine = tot[PID] || 0, top = ids.length && tot[ids[0]] === mine && mine > 0;

  app.innerHTML = `<h1 class="home-title">🏆 النتيجة النهائية</h1>
    <div class="namebox" style="text-align:center"><div style="font-size:2.4rem;font-weight:800">${tot} نقطة</div><div>لقيتو ${solved} من ${t.R} كلمات</div>
    <small>${esc(names(t.A))} 🤝 ${esc(names(t.B))}</small></div>
    <button class="ghost" id="lv" style="margin-top:12px">اخرج من الغرفة</button>`;
  document.getElementById('lv').addEventListener('click', () => onlineMenu());
  if (!ol.tmAwarded) {
    ol.tmAwarded = true;
    const win = solved >= Math.ceil(t.R / 2);
    try { bgRec('team', win ? 'win' : 'loss'); } catch (e) {}
    award(Math.min(60, 5 + tot), win);
    if (win) { sfx('win'); confetti(60); }
  }
}

/* ---------- اللعب ---------- */
function olStartPlay() {
  ol.phase = 'play';
  if (ol.room.game === 'bw') { ol.bwg = true; ol.bwKey = null; return bwSync(); }
  if (ol.room.game === 'team') { ol.tmg = true; ol.tmKey = null; return tmSync(); }
  if (ol.room.game === 'draw') { ol.drg = true; ol.drKey = null; return drSync(); }
  if (BOARD.includes(ol.room.game)) {
    ol.bgame = ol.room.game; ol.awarded = false; ol.sel = -1; ol.pick = -1; ol.cply = undefined;
    return obSync();
  }
  ol.i = 0;
  ol.score = 0;
  ol.ok = 0;
  ol.qs = [];
  ol.streak = 0;
  ol.hang = ol.room.game === 'hang';
  (ol.room.qs || []).forEach(k => {
    const parts = String(k).split('-');
    if (parts[0] === 'h') {
      const h = HANG[Number(parts[1])];
      if (h) ol.qs.push(h);
      return;
    }
    const a = Number(parts[0]), b = Number(parts[1]);
    const q = DATA[a] && DATA[a].q[b];
    if (q) ol.qs.push({ ...q, o: shuffle([q.c, ...q.w]), time: 20 });
  });
  if (!ol.qs.length) return onlineMenu('صارت مشكلة في الأسئلة');
  if (ol.room.live && !ol.hang && ol.room.t0) {
    ol.live = true;
    const go = () => olLive();
    try { getDb().ref('.info/serverTimeOffset').once('value').then(v => { ol.off = Number(v.val()) || 0; go(); }).catch(go); }
    catch (e) { go(); }
    return;
  }
  olCountdown(() => { ol.hang ? olHang() : olQuestion(); });
}

function olBoard() {
  const ps = olPlayers().sort((a, b) => (b.score || 0) - (a.score || 0));
  const total = (ol.room.qs || []).length;
  return ps.map((p, i) => `
    <div class="prow ${p.id === PID ? 'me' : ''}">
      <span class="rk">${i < 3 && (p.score || 0) > 0 ? ['🥇', '🥈', '🥉'][i] : i + 1}</span>
      <span class="nm">${esc(p.name)}${p.id === PID ? ' (انت)' : ''} <small>${p.fin ? 'كمّل' : (p.done || 0) + '/' + total}</small></span>
      <b>${Number(p.score) || 0}</b>
    </div>`).join('');
}

function olQuestion() {
  stopAll();
  const q = ol.qs[ol.i];
  ol.locked = false;
  st = { score: ol.score, mode: 'online', streak: ol.streak || 0 };
  app.innerHTML = `
    ${topBar(`السؤال <b>${ol.i + 1}</b> من ${ol.qs.length}`, q.time, 'online')}
    <div class="arch">${q.t}</div>
    <div class="opts">
      ${q.o.map((o, k) => `<button class="opt" data-k="${k}"><span dir="auto">${o}</span></button>`).join('')}
    </div>
    <div class="feedback" id="fb"></div>
    <div id="next"></div>
    <div class="lb-title">الترتيب مباشرة</div>
    <div id="lb">${olBoard()}</div>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => olAnswer(Number(b.dataset.k))));
  runTimer(q.time, () => olAnswer(-1));
}

function olAnswer(k) {
  if (ol.locked) return;
  ol.locked = true;
  const left = parseInt(document.getElementById('sec').textContent, 10) || 0;
  clearInterval(timer);
  const q = ol.qs[ol.i];
  const right = q.o.indexOf(q.c);
  const fb = document.getElementById('fb');

  app.querySelectorAll('.opt').forEach((b, idx) => {
    b.disabled = true;
    if (idx === right) b.classList.add('ok');
    else if (idx === k) b.classList.add('bad');
    else b.classList.add('dim');
  });

  if (k === right) {
    ol.streak = (ol.streak || 0) + 1;
    const pts = q.d * 10 + Math.floor(left / 4) + (ol.streak >= 3 ? 5 : 0);   // الصعوبة + السرعة + سلسلة
    ol.score += pts;
    ol.ok++;
    fb.className = 'feedback ok';
    fb.textContent = `${pick(OKM)} +${pts} نقطة` + (ol.streak >= 3 ? ` 🔥 ${ol.streak} على التوالي` : '');
    cue(true);
  } else {
    ol.streak = 0;
    fb.className = 'feedback bad';
    fb.textContent = (k === -1 ? 'الوقت خلص! ' : pick(KOM) + ' ') + `الجواب: ${q.c}`;
    cue(false);
  }

  const last = ol.i === ol.qs.length - 1;
  ol.ref.child('players/' + PID).update({ score: ol.score, done: ol.i + 1, fin: last }).catch(() => {});

  document.getElementById('next').innerHTML =
    `<button class="primary" id="nextBtn">${last ? 'شوف الترتيب' : 'السؤال التالي'}</button>`;
  const nb = document.getElementById('nextBtn');
  nb.addEventListener('click', () => { last ? olEnd() : (ol.i++, olQuestion()); });
  nb.focus();
}

/* ---------- النهاية ---------- */
function olEnd() {
  stopAll();
  ol.phase = 'end';
  const ps = olPlayers().sort((a, b) => (b.score || 0) - (a.score || 0));
  const first = ps[0];
  const allDone = ps.every(p => p.fin);
  const winner = allDone && first
    ? (first.id === PID ? 'مبروك، انت الأول! 🏆' : `الأول: ${esc(first.name)} 🏆`)
    : 'نستناو الباقي يكمّلوا...';
  if (!ol.awarded) { ol.awarded = true; award(ol.score); }
  if (allDone && !ol.celebrated) {
    ol.celebrated = true;
    if (first && first.id === PID) { confetti(130); sfx('win'); } else sfx('go');
  }
  app.innerHTML = `
    <div class="res-head">
      <div class="res-score">${ol.score}<span> نقطة</span></div>
      <div class="res-msg">${winner}</div>
      <div class="res-stats">${ol.ok} إجابات صحيحة من ${ol.qs.length}</div>
    </div>
    <div class="lb-title">الترتيب</div>
    <div>${olBoard()}</div>
    <div class="actions">
      <button class="ghost" id="menu">القائمة الرئيسية</button>
    </div>`;
  document.getElementById('menu').addEventListener('click', () => { olLeave(); home(); });
}

/* ============ الدردشة الصوتية (WebRTC) ============
   الصوت يمشي مباشرة بين التيليفونات، وFirebase يستعمل برك باش يعرّف اللاعبين ببعضهم. */
let ICE = { iceServers: [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' }
] };
let TURN_ON = false;
// خدمة TURN اختيارية (تتحط في config.js) باش يخدم الصوت بين شبكتين مختلفتين
async function loadIce() {
  const c = window.CHNWA || {};
  if (TURN_ON) return;
  const extra = Array.isArray(c.iceServers) ? c.iceServers.slice() : [];
  if (c.turnApi) {
    try {
      const ctl = new AbortController();
      const to = setTimeout(() => ctl.abort(), 4000);
      const r = await fetch(c.turnApi, { signal: ctl.signal });
      clearTimeout(to);
      const arr = await r.json();
      if (Array.isArray(arr)) arr.forEach(x => extra.push(x));
    } catch (e) {}
  }
  if (extra.length) { ICE = { iceServers: ICE.iceServers.concat(extra) }; TURN_ON = true; }
}

function vSend(to, type, data) {
  try { ol.ref.child('sig/' + to).push({ from: PID, type, data: JSON.stringify(data) }); } catch (e) {}
}

function vPeer(id) {
  if (ol.peers[id]) return ol.peers[id];
  const pc = new RTCPeerConnection(ICE);
  const p = { pc, queue: [], audio: null, since: Date.now() };
  ol.peers[id] = p;
  if (ol.local) ol.local.getTracks().forEach(t => pc.addTrack(t, ol.local));
  else pc.addTransceiver('audio', { direction: 'recvonly' });
  pc.ontrack = e => {
    const stream = e.streams[0] || new MediaStream([e.track]);
    if (!p.audio) {
      p.audio = document.createElement('audio');
      p.audio.autoplay = true;
      p.audio.playsInline = true;
      document.body.appendChild(p.audio);
    }
    p.audio.srcObject = stream;
    p.audio.play().catch(() => {});
    vMeter(id, stream);
  };
  pc.onicecandidate = e => { if (e.candidate) vSend(id, 'ice', e.candidate.toJSON()); };
  pc.onconnectionstatechange = () => {
    const st = pc.connectionState;
    if (ol && ol.peers[id] === p) {
      if (st === 'connected') ol.vfail = '';
      else if (st === 'failed') {
        if (!p.retried && PID < id) { p.retried = true; vOffer(id, true); }
        else ol.vfail = TURN_ON ? 'الصوت ما قدرش يوصل، اخرج وعاود فعّلو' : 'الصوت ما وصلش بين الشبكتين (يحتاج خدمة TURN)';
      }
    }
    vBar();
  };
  return p;
}

/* مؤشّر "يحكي": تحليل الصوت محلّيا بدون سيرفر */
function vMeter(id, stream) {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC || !ol) return;
    if (!ol.ac) ol.ac = new AC();
    if (!ol.meters) ol.meters = {};
    const an = ol.ac.createAnalyser();
    an.fftSize = 256;
    ol.ac.createMediaStreamSource(stream).connect(an);
    ol.meters[id] = { an, buf: new Uint8Array(an.fftSize), on: false };
    if (!ol.mt) ol.mt = setInterval(vTick, 220);
  } catch (e) {}
}
function vTick() {
  if (!ol || !ol.meters) return;
  Object.keys(ol.meters).forEach(id => {
    const m = ol.meters[id];
    m.an.getByteTimeDomainData(m.buf);
    let mx = 0;
    for (let i = 0; i < m.buf.length; i++) mx = Math.max(mx, Math.abs(m.buf[i] - 128));
    const on = mx > 8 && !(id === PID && ol.muted);
    if (on !== m.on) {
      m.on = on;
      document.querySelectorAll('[data-vid="' + id + '"]').forEach(el => el.classList.toggle('talk', on));
    }
  });
}
function vIcon(id) {
  const v = ol && ol.room && ol.room.voice && ol.room.voice[id];
  return v ? (v === 'm' ? '🔇' : '🎤') : '';
}
function vNames() {
  const v = (ol.room && ol.room.voice) || {}, pl = (ol.room && ol.room.players) || {};
  return Object.keys(v).filter(id => pl[id]).map(id => `<span class="vchip ${ol.meters && ol.meters[id] && ol.meters[id].on ? 'talk' : ''}" data-vid="${esc(id)}">${v[id] === 'm' ? '🔇' : '🎤'} ${esc(pl[id].name)}${id === PID ? ' (انت)' : ''}</span>`).join('');
}

function vClose(id) {
  if (ol && ol.meters && ol.meters[id]) delete ol.meters[id];
  const p = ol && ol.peers[id];
  if (!p) return;
  try { p.pc.close(); } catch (e) {}
  if (p.audio) { p.audio.srcObject = null; p.audio.remove(); }
  delete ol.peers[id];
}

async function vFlush(p) {
  while (p.queue.length) {
    try { await p.pc.addIceCandidate(p.queue.shift()); } catch (e) {}
  }
}

async function vOffer(id, restart) {
  const p = vPeer(id);
  try {
    const offer = await p.pc.createOffer(restart ? { iceRestart: true } : undefined);
    await p.pc.setLocalDescription(offer);
    vSend(id, 'offer', p.pc.localDescription.toJSON());
  } catch (e) {}
}

async function onSignal(m) {
  if (!ol || !ol.voice || !m || !m.from) return;
  let d;
  try { d = JSON.parse(m.data); } catch (e) { return; }
  try {
    if (m.type === 'offer') {
      if (ol.peers[m.from]) vClose(m.from);
      const p = vPeer(m.from);
      await p.pc.setRemoteDescription(d);
      await vFlush(p);
      const ans = await p.pc.createAnswer();
      await p.pc.setLocalDescription(ans);
      vSend(m.from, 'answer', p.pc.localDescription.toJSON());
    } else if (m.type === 'answer') {
      const p = ol.peers[m.from];
      if (!p) return;
      await p.pc.setRemoteDescription(d);
      await vFlush(p);
    } else if (m.type === 'ice') {
      const p = ol.peers[m.from];
      if (!p) return;
      if (p.pc.remoteDescription) await p.pc.addIceCandidate(d);
      else p.queue.push(d);
    }
  } catch (e) {}
  vBar();
}

// يتنادى كل ما تتبدّل الغرفة: اللي ID متاعو أصغر هو اللي يبدا الاتصال
function voiceSync() {
  if (!ol || !ol.voice) return;
  const v = (ol.room && ol.room.voice) || {};
  Object.keys(ol.peers).forEach(id => {
    if (!v[id] && Date.now() - ol.peers[id].since > 3000) vClose(id);
  });
  Object.keys(v).forEach(id => {
    if (id !== PID && !ol.peers[id] && PID < id) vOffer(id);
  });
  vBar();
}

async function voiceJoin() {
  if (!ol || ol.voice) return;
  const mine = ol;
  mine.voice = true;
  mine.muted = false;
  mine.vmsg = '';
  mine.vfail = '';
  vBar();
  await loadIce();
  let s = null;
  try {
    s = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
  } catch (e) {
    const n = e && e.name;
    mine.vmsg = (!window.isSecureContext || !navigator.mediaDevices) ? 'الميكرو يحتاج رابط https (تسمع برك)'
              : n === 'NotAllowedError' ? 'الإذن مرفوض (تسمع برك)'
              : n === 'NotFoundError' ? 'ما لقيناش ميكرو (تسمع برك)'
              : 'الميكرو موش متاح (تسمع برك)';
  }
  if (ol !== mine || !mine.voice) { if (s) s.getTracks().forEach(t => t.stop()); return; }
  mine.local = s;
  try {
    const r = mine.ref.child('voice/' + PID);
    r.onDisconnect().remove();
    await r.set(true);
  } catch (e) {}
  if (mine.local) vMeter(PID, mine.local);
  voiceSync();
}

function voiceStop(removeFlag) {
  if (!ol) return;
  Object.keys(ol.peers).forEach(vClose);
  if (ol.local) ol.local.getTracks().forEach(t => t.stop());
  ol.local = null;
  if (ol.voice && removeFlag) {
    try { ol.ref.child('voice/' + PID).remove(); } catch (e) {}
  }
  ol.voice = false;
  ol.meters = {};
}

function voiceMute() {
  if (!ol || !ol.local) return;
  ol.muted = !ol.muted;
  ol.local.getAudioTracks().forEach(t => { t.enabled = !ol.muted; });
  try { ol.ref.child('voice/' + PID).set(ol.muted ? 'm' : true); } catch (e) {}
  vBar();
}

function vBar() {
  const el = document.getElementById('vbar');
  if (!el || !ol) return;
  const vn = document.getElementById('vn');
  if (vn) vn.innerHTML = ol.voice ? vNames() : '';
  if (!ol.voice) {
    el.innerHTML = `<button class="vbtn" id="vjoin">🎤 فعّل الصوت</button>`;
    document.getElementById('vjoin').addEventListener('click', voiceJoin);
    return;
  }
  const others = Object.keys((ol.room && ol.room.voice) || {}).filter(id => id !== PID).length;
  const live = Object.values(ol.peers).filter(p => p.pc.connectionState === 'connected').length;
  el.innerHTML = `
    ${ol.local ? `<button class="vbtn ${ol.muted ? 'muted' : ''}" id="vmute">${ol.muted ? '🔇 مكتوم' : '🎤 تحكي'}</button>` : ''}
    <span class="vinfo">${ol.vmsg ? esc(ol.vmsg) : ol.vfail ? esc(ol.vfail) : '🔊 ' + live + '/' + others}</span>
    <button class="vbtn soft" id="vleave">اخرج</button>`;
  const mu = document.getElementById('vmute');
  if (mu) mu.addEventListener('click', voiceMute);
  document.getElementById('vleave').addEventListener('click', () => { voiceStop(true); vBar(); });
}

initUi();
home();
acInit();

/* رجوع تلقائي للغرفة كان التطبيق تسكّر (خاصة في الأيفون) */
setTimeout(async () => {
  try {
    const code = store('lastroom'), db = getDb();
    if (!code || !db || ol) return;
    const room = (await db.ref('rooms/' + code).once('value')).val();
    if (!room || !room.players || !room.players[PID]) return store('lastroom', '');
    if (room.status === 'lobby' || ['bw', 'draw', 'team'].indexOf(room.game) >= 0) { olEnter(code, room.host === PID); toast('رجعناك للغرفة ✅'); }
    else store('lastroom', '');
  } catch (e) {}
}, 1800);

/* زر الرجوع متاع التلفون: يرجّع للقائمة بدل ما يخرج من التطبيق */
(function () {
  let exitT = 0;
  try {
    history.replaceState({ a: 0 }, '');
    history.pushState({ a: 1 }, '');
    window.addEventListener('popstate', () => {
      history.pushState({ a: 1 }, '');
      if (ol) { toast('باش تخرج كبس «اخرج من الغرفة»'); return; }
      const b = document.getElementById('back');
      if (b) { b.click(); return; }
      if (document.querySelector('.hero')) {
        if (Date.now() - exitT < 2000) { history.go(-2); return; }
        exitT = Date.now();
        toast('كبس مرة أخرى باش تخرج');
        return;
      }
      home();
    });
  } catch (e) {}
})();
